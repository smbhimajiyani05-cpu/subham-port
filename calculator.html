<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0a0a0a;
color:#fff;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

/* ⭐ back button */
.backBtn{
position:fixed;
top:20px;
left:20px;
background:#fff;
color:#000;
border:none;
padding:10px 18px;
border-radius:25px;
cursor:pointer;
font-weight:bold;
transition:.25s;
}

.backBtn:hover{
transform:translateY(-2px);
box-shadow:0 4px 12px #fff3;
}

/* ⭐ glass calculator */
.calc{
background:rgba(255,255,255,0.06);
backdrop-filter:blur(12px);
padding:25px;
border-radius:22px;
box-shadow:0 10px 35px rgba(255,255,255,0.1);
width:360px;
text-align:center;
animation:fade .5s ease;
}

@keyframes fade{
from{opacity:0;transform:translateY(15px);}
to{opacity:1;transform:translateY(0);}
}

/* ⭐ display */
.display{
width:100%;
height:60px;
font-size:24px;
text-align:right;
padding:10px;
border:none;
border-radius:14px;
margin-bottom:12px;
background:#111;
color:#fff;
}

/* ⭐ buttons */
.calc button{
width:70px;
height:50px;
margin:5px;
border:none;
border-radius:14px;
cursor:pointer;
font-size:18px;
background:#fff;
color:#000;
transition:.2s;
}

.calc button:hover{
transform:translateY(-2px);
box-shadow:0 6px 15px #fff3;
}

/* ⭐ history popup */
.popup{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%) scale(0);
background:#111;
padding:20px;
border-radius:15px;
box-shadow:0 10px 30px rgba(255,255,255,0.15);
width:300px;
max-height:300px;
overflow:auto;
transition:.25s;
}
.popup.active{transform:translate(-50%,-50%) scale(1);}
</style>
</head>

<body>

<button class="backBtn" onclick="location.href='index.html'">⬅ Back</button>

<div class="calc">
<h3>Calculator</h3>

<input id="display" class="display">

<div>
<button onclick="press('7')">7</button>
<button onclick="press('8')">8</button>
<button onclick="press('9')">9</button>
<button onclick="press('/')">÷</button>

<button onclick="press('4')">4</button>
<button onclick="press('5')">5</button>
<button onclick="press('6')">6</button>
<button onclick="press('*')">×</button>

<button onclick="press('1')">1</button>
<button onclick="press('2')">2</button>
<button onclick="press('3')">3</button>
<button onclick="press('-')">−</button>

<button onclick="press('0')">0</button>
<button onclick="press('.')">.</button>
<button onclick="del()">⌫</button>
<button onclick="press('+')">+</button>

<button onclick="press('Math.sqrt(')">√</button>
<button onclick="press('Math.pow(')">xʸ</button>
<button onclick="clearAll()">C</button>
<button style="width:150px" onclick="calc()">=</button>

<button style="width:150px" onclick="openHistory()">📜 History</button>
</div>
</div>

<div class="popup" id="historyPopup">
<h3>History</h3>
<div id="historyData"></div>

<button onclick="clearHistory()">🗑 Clear</button>
<button onclick="closeHistory()">Close</button>
</div>

<script>
let history=[];

function press(v){document.getElementById("display").value+=v;}
function clearAll(){document.getElementById("display").value="";}
function del(){let d=document.getElementById("display");d.value=d.value.slice(0,-1);}

function calc(){
try{
let exp=document.getElementById("display").value;
let result=eval(exp);
document.getElementById("display").value=result;
history.push(exp+" = "+result);
}catch{alert("Invalid");}
}

function openHistory(){
document.getElementById("historyPopup").classList.add("active");
document.getElementById("historyData").innerHTML=history.join("<br>");
}

function closeHistory(){
document.getElementById("historyPopup").classList.remove("active");
}

function clearHistory(){
history=[];
document.getElementById("historyData").innerHTML="";
}

document.addEventListener("keydown",e=>{
if("0123456789+-*/.".includes(e.key)) press(e.key);
if(e.key==="Enter") calc();
if(e.key==="Backspace") del();
});

window.onload=()=>{history=[];}
</script>

</body>
</html>
