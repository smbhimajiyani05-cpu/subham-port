<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iPhone Style Calculator</title>

<style>
body{
margin:0;
background:#000;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
padding:15px;
box-sizing:border-box;
}

/* 🔙 Back Button */
.backBtn{
position:fixed;
top:20px;
left:20px;
background:rgba(255,255,255,0.15);
color:#fff;
border:none;
padding:8px 16px;
border-radius:20px;
font-size:14px;
cursor:pointer;
backdrop-filter:blur(10px);
transition:0.2s;
}

.backBtn:hover{
background:rgba(255,255,255,0.25);
}

/* Calculator */
.calc{
width:100%;
max-width:380px;
}

/* Display */
.display{
width:100%;
height:clamp(70px,18vw,100px);
background:#000;
border:none;
color:#fff;
font-size:clamp(28px,8vw,52px);
text-align:right;
padding:10px;
box-sizing:border-box;
outline:none;
}

/* Grid */
.buttons{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:clamp(8px,2.5vw,14px);
}

/* Button Base */
button{
height:clamp(55px,16vw,75px);
border:none;
border-radius:50%;
font-size:clamp(18px,5vw,24px);
cursor:pointer;
transition:0.1s;
}

.gray{background:#a5a5a5;color:#000;}
.dark{background:#333;color:#fff;}
.orange{background:#ff9f0a;color:#fff;}

.zero{
grid-column:span 2;
border-radius:40px;
text-align:left;
padding-left:clamp(18px,5vw,28px);
}

button:active,
button.active{
transform:scale(0.9);
opacity:0.7;
}

@media (max-width:350px){
.buttons{gap:8px;}
}
</style>
</head>

<body>

<!-- 🔙 Back Button -->
<button class="backBtn" onclick="location.href='index.html'">⬅ Back</button>

<div class="calc">
<input type="text" id="display" class="display" readonly>

<div class="buttons">

<button class="gray" data-key="Escape" onclick="clearAll()">AC</button>
<button class="gray" data-key="Backspace" onclick="del()">⌫</button>
<button class="gray" data-key="%" onclick="press('%')">%</button>
<button class="orange" data-key="/" onclick="press('/')">÷</button>

<button class="dark" data-key="7" onclick="press('7')">7</button>
<button class="dark" data-key="8" onclick="press('8')">8</button>
<button class="dark" data-key="9" onclick="press('9')">9</button>
<button class="orange" data-key="*" onclick="press('*')">×</button>

<button class="dark" data-key="4" onclick="press('4')">4</button>
<button class="dark" data-key="5" onclick="press('5')">5</button>
<button class="dark" data-key="6" onclick="press('6')">6</button>
<button class="orange" data-key="-" onclick="press('-')">−</button>

<button class="dark" data-key="1" onclick="press('1')">1</button>
<button class="dark" data-key="2" onclick="press('2')">2</button>
<button class="dark" data-key="3" onclick="press('3')">3</button>
<button class="orange" data-key="+" onclick="press('+')">+</button>

<button class="dark zero" data-key="0" onclick="press('0')">0</button>
<button class="dark" data-key="." onclick="press('.')">.</button>
<button class="orange" data-key="Enter" onclick="calc()">=</button>

</div>
</div>

<script>
function press(v){
display.value += v;
}

function clearAll(){
display.value="";
}

function del(){
display.value = display.value.slice(0,-1);
}

function calc(){
try{
display.value = eval(display.value);
}catch{
alert("Invalid");
}
}

document.addEventListener("keydown",e=>{
let key = e.key;

if("0123456789+-*/.%".includes(key)){ press(key); }
if(key==="Enter"){ calc(); }
if(key==="Backspace"){ del(); }
if(key==="Escape"){ clearAll(); }

let btn = document.querySelector(`button[data-key="${key}"]`);
if(btn){
btn.classList.add("active");
setTimeout(()=>btn.classList.remove("active"),100);
}
});
</script>

</body>
</html>
